name: CI

on:
  push:
    branches: [main]
  pull_request:

# Test runs must not show up in the setup analytics
env:
  CODEX_NOTIFIER_NO_ANALYTICS: "1"
  # Runners have no keychain a test should touch
  CODEX_NOTIFIER_CREDENTIAL_STORE: file

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the macOS notifier app
        if: runner.os == 'macOS'
        run: |
          scripts/build-macos-notifier.sh 0.0.0 "$RUNNER_TEMP"
          echo "CODEX_NOTIFIER_NOTIFIER_APP=$RUNNER_TEMP/Notifier for Codex.app" >> "$GITHUB_ENV"
      - run: cargo build --locked
      - run: cargo test --locked
      - name: The notifier app is embedded and written out intact
        if: runner.os == 'macOS'
        env:
          CODEX_NOTIFIER_HOME: ${{ runner.temp }}/cxn-notifier
          CODEX_HOME: ${{ runner.temp }}/codex-notifier-app
          CODEX_NOTIFIER_SERVER_URL: http://127.0.0.1:9
        run: |
          mkdir -p "$CODEX_HOME"
          ./target/debug/codex-notifier doctor | grep "desktop notifications"
          codesign --verify --strict "$CODEX_NOTIFIER_HOME/Notifier for Codex.app"
      - name: Smoke test the hook without a pairing
        shell: bash
        env:
          CODEX_NOTIFIER_HOME: ${{ runner.temp }}/cxn
          CODEX_HOME: ${{ runner.temp }}/codex
          CODEX_NOTIFIER_SERVER_URL: http://127.0.0.1:9
          CODEX_NOTIFIER_PRESENCE: present
          CODEX_NOTIFIER_NOTIFY: "off"
        run: |
          mkdir -p "$CODEX_HOME"
          printf 'model = "gpt-5.4"\n' > "$CODEX_HOME/config.toml"
          # An unpaired hook must exit 0 quickly and print nothing that changes Codex's behaviour
          out=$(echo '{"hook_event_name":"Stop","session_id":"ci","cwd":"/tmp"}' | ./target/debug/codex-notifier hook)
          test -z "$out"
          ./target/debug/codex-notifier setup
          grep -q '"Stop"' "$CODEX_HOME/hooks.json"
          grep -q 'trusted_hash' "$CODEX_HOME/config.toml"
          grep -q 'model = "gpt-5.4"' "$CODEX_HOME/config.toml"
          # A second setup changes nothing
          before=$(cat "$CODEX_HOME/hooks.json" "$CODEX_HOME/config.toml")
          ./target/debug/codex-notifier setup
          test "$before" = "$(cat "$CODEX_HOME/hooks.json" "$CODEX_HOME/config.toml")"
          ./target/debug/codex-notifier uninstall
          # Uninstall removes the hooks and their trust entries and leaves the rest of config.toml
          if [ -e "$CODEX_HOME/hooks.json" ] && grep -q 'codex-notifier' "$CODEX_HOME/hooks.json"; then
            echo "hooks still installed"; exit 1
          fi
          if grep -q 'trusted_hash' "$CODEX_HOME/config.toml"; then echo "trust entries left"; exit 1; fi
          test "$(tr -d ' \n\r' < "$CODEX_HOME/config.toml")" = 'model="gpt-5.4"'

  install-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package a local release and serve it
        shell: bash
        run: |
          mkdir dist
          target=$(rustc -vV | sed -n 's/^host: //p')
          target=${target/unknown-linux-gnu/unknown-linux-musl}
          if [ "$RUNNER_OS" = Windows ]; then
            (cd target/release && 7z a ../../dist/codex-notifier-$target.zip codex-notifier.exe)
          else
            tar czf dist/codex-notifier-$target.tar.gz -C target/release codex-notifier
          fi
          (cd dist && (sha256sum * 2>/dev/null || shasum -a 256 *) > SHA256SUMS && cat SHA256SUMS)
          (cd dist && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          CODEX_NOTIFIER_DOWNLOAD_BASE: http://127.0.0.1:8765
          CODEX_NOTIFIER_INSTALL_DIR: ${{ runner.temp }}/bin
          CODEX_NOTIFIER_HOME: ${{ runner.temp }}/cxn-install
          CODEX_HOME: ${{ runner.temp }}/codex-install
          CODEX_NOTIFIER_SERVER_URL: http://127.0.0.1:9
        run: |
          sh install/install.sh
          "$CODEX_NOTIFIER_INSTALL_DIR/codex-notifier" --version
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CODEX_NOTIFIER_DOWNLOAD_BASE: http://127.0.0.1:8765
          CODEX_NOTIFIER_INSTALL_DIR: ${{ runner.temp }}\bin
          CODEX_NOTIFIER_HOME: ${{ runner.temp }}\cxn-install
          CODEX_HOME: ${{ runner.temp }}\codex-install
          CODEX_NOTIFIER_SERVER_URL: http://127.0.0.1:9
        run: |
          Get-Content install/install.ps1 -Raw | iex
          codex-notifier --version
          # Running it again replaces the binary in place
          Get-Content install/install.ps1 -Raw | iex
          codex-notifier --version
