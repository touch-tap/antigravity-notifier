name: CI

on:
  push:
    branches: [main]
  pull_request:

# Test runs must not show up in the setup analytics
env:
  ANTIGRAVITY_NOTIFIER_NO_ANALYTICS: "1"
  # Runners have no keychain a test should touch
  ANTIGRAVITY_NOTIFIER_CREDENTIAL_STORE: file

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the macOS notifier app
        if: runner.os == 'macOS'
        run: |
          scripts/build-macos-notifier.sh 0.0.0 "$RUNNER_TEMP"
          echo "ANTIGRAVITY_NOTIFIER_NOTIFIER_APP=$RUNNER_TEMP/Antigravity Notifier.app" >> "$GITHUB_ENV"
      - run: cargo build --locked
      - run: cargo test --locked
      - name: The notifier app is embedded and written out intact
        if: runner.os == 'macOS'
        env:
          ANTIGRAVITY_NOTIFIER_HOME: ${{ runner.temp }}/agn-notifier
          ANTIGRAVITY_NOTIFIER_GEMINI_HOME: ${{ runner.temp }}/gemini-app
          ANTIGRAVITY_NOTIFIER_SERVER_URL: http://127.0.0.1:9
        run: |
          ./target/debug/antigravity-notifier doctor | grep "desktop notifications"
          codesign --verify --strict "$ANTIGRAVITY_NOTIFIER_HOME/Antigravity Notifier.app"
      - name: Smoke test the hook without a pairing
        shell: bash
        env:
          ANTIGRAVITY_NOTIFIER_HOME: ${{ runner.temp }}/agn
          ANTIGRAVITY_NOTIFIER_GEMINI_HOME: ${{ runner.temp }}/gemini
          ANTIGRAVITY_NOTIFIER_SERVER_URL: http://127.0.0.1:9
          ANTIGRAVITY_NOTIFIER_PRESENCE: present
          ANTIGRAVITY_NOTIFIER_NOTIFY: "off"
        run: |
          H="$ANTIGRAVITY_NOTIFIER_GEMINI_HOME/config/hooks.json"
          mkdir -p "$(dirname "$H")"
          printf '{ "mine": { "Stop": [ { "type": "command", "command": "echo hi" } ] } }\n' > "$H"
          # Antigravity blocks a tool call whose PreToolUse hook fails or prints no decision:
          # an unpaired hook must exit 0 and allow, whatever it is given
          out=$(./target/debug/antigravity-notifier hook PreToolUse < tests/fixtures/pre_tool_use_run_command.json)
          test "$out" = '{"decision":"allow"}'
          out=$(echo 'not json' | ./target/debug/antigravity-notifier hook PreToolUse)
          test "$out" = '{"decision":"allow"}'
          out=$(./target/debug/antigravity-notifier hook Stop < tests/fixtures/stop.json)
          test "$out" = '{}'
          ./target/debug/antigravity-notifier setup
          grep -q '"antigravity-notifier"' "$H"
          grep -q 'hook PreToolUse' "$H"
          grep -q 'echo hi' "$H"
          # A second setup changes nothing
          before=$(cat "$H")
          ./target/debug/antigravity-notifier setup
          test "$before" = "$(cat "$H")"
          ./target/debug/antigravity-notifier uninstall
          # Uninstall removes our group and leaves the other one
          if grep -q 'antigravity-notifier' "$H"; then echo "hooks still installed"; exit 1; fi
          grep -q 'echo hi' "$H"

  install-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package a local release and serve it
        shell: bash
        run: |
          mkdir dist
          target=$(rustc -vV | sed -n 's/^host: //p')
          target=${target/unknown-linux-gnu/unknown-linux-musl}
          if [ "$RUNNER_OS" = Windows ]; then
            (cd target/release && 7z a ../../dist/antigravity-notifier-$target.zip antigravity-notifier.exe)
          else
            tar czf dist/antigravity-notifier-$target.tar.gz -C target/release antigravity-notifier
          fi
          (cd dist && (sha256sum * 2>/dev/null || shasum -a 256 *) > SHA256SUMS && cat SHA256SUMS)
          (cd dist && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          ANTIGRAVITY_NOTIFIER_DOWNLOAD_BASE: http://127.0.0.1:8765
          ANTIGRAVITY_NOTIFIER_INSTALL_DIR: ${{ runner.temp }}/bin
          ANTIGRAVITY_NOTIFIER_HOME: ${{ runner.temp }}/agn-install
          ANTIGRAVITY_NOTIFIER_GEMINI_HOME: ${{ runner.temp }}/gemini-install
          ANTIGRAVITY_NOTIFIER_SERVER_URL: http://127.0.0.1:9
        run: |
          sh install/install.sh
          "$ANTIGRAVITY_NOTIFIER_INSTALL_DIR/antigravity-notifier" --version
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ANTIGRAVITY_NOTIFIER_DOWNLOAD_BASE: http://127.0.0.1:8765
          ANTIGRAVITY_NOTIFIER_INSTALL_DIR: ${{ runner.temp }}\bin
          ANTIGRAVITY_NOTIFIER_HOME: ${{ runner.temp }}\agn-install
          ANTIGRAVITY_NOTIFIER_GEMINI_HOME: ${{ runner.temp }}\gemini-install
          ANTIGRAVITY_NOTIFIER_SERVER_URL: http://127.0.0.1:9
        run: |
          Get-Content install/install.ps1 -Raw | iex
          antigravity-notifier --version
          # Running it again replaces the binary in place
          Get-Content install/install.ps1 -Raw | iex
          antigravity-notifier --version
