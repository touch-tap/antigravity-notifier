ShortDescription: Notifier for Codex in the terminal, with phone notifications and approvals for OpenAI Codex
Description: |-
  Get a push on your phone when OpenAI Codex finishes or needs you, and approve, deny or answer
  from there. codex-notifier is one small binary that Codex calls through its hooks: it runs for a
  few milliseconds when something happens and exits, with no app running in the background. It
  also shows a Windows toast on the desktop. Pair it with the Notifier for Codex app for iPhone or
  Android with "codex-notifier pair <code>", or run "codex-notifier" and scan the QR code.
