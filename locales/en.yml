test:
  none_paired: "no phones are paired. Run `antigravity-notifier pair <code>`."
  sent: "Sent a test notification to %{name} (%{platform})."
  failed: "%{name}: %{error}"

devices:
  none: "No phones paired. Run `antigravity-notifier pair <code>` with the code from the app."
  # %{name} is padded to 24 columns and %{platform} to 8 before they are filled in
  row: "%{name} %{platform} paired %{since}%{off}"
  notifications_off: "  (notifications off)"
  revoked: "Revoked %{name}."
  no_such_phone: "no paired phone called '%{device}'"

config:
  local_only: "(local only)"
  last_changed: "(last changed %{when}; also editable from the phone)"
  credentials_moved: "Credentials are now in the %{store}."
  credential_store_expects: "credential_store expects keychain or file"
  auto_update_expects: "auto_update expects on or off"
  phone_approvals_expects: "phone_approvals expects all, commands or off"

settings:
  expects_on_off: "%{key} expects on or off"
  expects_seconds: "%{key} expects a number of seconds"
  seconds_range: "%{key} must be between %{min} and %{max} seconds"
  quiet_hours_format: "quiet_hours expects HH:MM-HH:MM, or off"
  quiet_hours_example: "quiet_hours expects HH:MM-HH:MM, e.g. 22:00-08:00"
  unknown: "unknown setting '%{key}'. Settings: notify_on_done, notify_on_permission, notify_on_question, sound, quiet_when_present, quiet_hours, hold_ceiling_seconds, presence_threshold_seconds, stop_hold_seconds, reminder_interval_seconds"

forget:
  needs_yes: "antigravity-notifier forget needs a yes from you: run it in a terminal, or add --yes"
  warning: "This erases this computer and its pairings from the Antigravity Notifier server, then\nremoves antigravity-notifier from Antigravity and deletes its credentials and files here, as `antigravity-notifier uninstall` does.\nPhones paired with this computer will see it disappear."
  # Printed under the warning only where licences are sold on the website
  warning_licence: "A licence bought on the website is not cancelled: do that at %{licence_url}\nwith \"Erase my licence\"."
  # The word the user must type; `yes` is always accepted as well
  yes_word: "yes"
  prompt: "\nType %{yes} to continue: "
  nothing_erased: "Nothing was erased."
  erased: "Erased this computer and its pairings from the server."
  already_forgotten: "The server had already forgotten this computer."
  nothing_removed: "%{error}. Nothing was removed from this computer, so you can run `antigravity-notifier forget` again"
  not_registered: "This computer isn't registered with the server, so there is nothing to erase there."

uninstall:
  hooks_removed: "Removed antigravity-notifier's hooks from %{path}."
  slot_freed: "Freed this computer's licence slot."
  unpaired_all: "Unpaired every phone."
  removed_dir: "Removed %{path}."

local:
  finished_title: "Antigravity has finished"
  finished_body: "Antigravity has finished and is waiting for you."
  error_title: "Antigravity stopped with an error"
  question_title: "Antigravity has a question"
  first_nudge: "Get these on your phone: antigravity-notifier pair"
  milestone_nudge: "10 notifications so far. Get them on your phone, with approvals from the lock screen: run antigravity-notifier pair"
  pair_message: "Antigravity Notifier: you get desktop notifications. To get them on your phone too, and approve or answer from there, run `antigravity-notifier pair` in a terminal."

hook:
  licence_message: "Antigravity Notifier: phone notifications aren't unlocked for this computer. Unlock them: antigravity-notifier unlock"
  unpaired_message: "Antigravity Notifier: this computer isn't paired any more, so your phone won't get notifications. Run `antigravity-notifier pair` in a terminal to reconnect."
  unpaired_notification: "This computer isn't paired any more. Run `antigravity-notifier pair` in a terminal to reconnect."
  paired_message: "Antigravity Notifier: paired with %{phone}. Notifications now go to your phone."
  # The server writes title, body and command in the user's language; this only joins them
  nudge_message: "Antigravity Notifier: %{title} %{body} %{command}"
  needs_attention: "Needs your attention"
  # Shown on Antigravity's own permission prompt when a request waited for the phone and nobody answered
  no_answer: "No answer from your phone"
  unreachable: "Couldn't reach your phone"

# Suggests the Claude Code Notifier app (and its ccn CLI) to someone who also uses Claude Code (crosspromo.rs).
# "Claude Code Notifier", command and url are not translated; never name one computer platform.
cross_promo:
  line: "Claude Code detected — get Claude Code approvals and questions on your phone too, with the Claude Code Notifier app (iPhone and Android). Set up this computer with one command: %{command}  ·  %{url}"
  notification: "Claude Code detected — get Claude Code approvals on your phone too, with the Claude Code Notifier app."
  # After `antigravity-notifier pair`, above a QR code (pair_scan) or without one (pair_steps), the app's link and the command
  pair_title: "Claude Code detected — get Claude Code approvals and questions on your phone too, with the Claude Code Notifier app (iPhone and Android)."
  pair_scan: "Scan for the app, then set up this computer with one command:"
  pair_steps: "Get the app, then set up this computer with one command:"

# The same for Notifier for Codex, to someone with OpenAI's Codex CLI and not codex-notifier
cross_promo_codex:
  line: "Codex detected — get Codex approvals and questions on your phone too, with the Notifier for Codex app (iPhone and Android). Set up this computer with one command: %{command}  ·  %{url}"
  notification: "Codex detected — get Codex approvals on your phone too, with the Notifier for Codex app."
  pair_title: "Codex detected — get Codex approvals and questions on your phone too, with the Notifier for Codex app (iPhone and Android)."
  pair_scan: "Scan for the app, then set up this computer with one command:"
  pair_steps: "Get the app, then set up this computer with one command:"

# The push when a tool call that was allowed with the user at the keyboard is still open after
# they walked away (walkaway.rs). %{summary} is the command or file; it can't be approved from the phone.
walkaway:
  title: "Antigravity may be waiting for you"
  body: "%{summary} hasn't finished. If it needs approval, that's at your computer."

# Asks once, after 20 answers from the phone, for an app-store rating (rate.rs). url is not translated.
rate:
  notification: "Enjoying Antigravity Notifier? A quick rating helps other developers find it."
  message: "Enjoying Antigravity Notifier? A quick rating helps other developers find it: %{url}"

hooks:
  doctor_presence_none: "presence: not detectable here, so nothing waits for the phone: it gets a note and you answer in the terminal (`antigravity-notifier config set hold_without_presence on` to wait anyway)"
  doctor_presence_none_hold: "presence: not detectable here, and hold_without_presence is on, so every request waits for the phone until it answers or the hold ceiling passes"

