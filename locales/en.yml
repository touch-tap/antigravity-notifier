api:
  rejected: "this computer isn't paired any more (the server no longer recognises it). Run `antigravity-notifier pair` to reconnect"
  server_returned: "server returned %{status}"
  # What was being done when the server said no; the server's own message follows a colon
  registering: "registering this computer"
  pairing: "pairing"
  requesting_code: "requesting a pairing code"
  reading_record: "reading this computer's record"
  erasing: "erasing this computer"
