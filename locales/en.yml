# A second upgrader found the first one still running
update_lock:
  busy: "another antigravity-notifier upgrade is already running. Try again in a few minutes"

local_files:
  config_unreadable: "%{path} can't be read (%{error}), so antigravity-notifier won't write over it. Fix the file, or delete it and run `antigravity-notifier pair` again."
  slot_not_freed: "Couldn't free this computer's licence slot (%{error}). If it has a licence, free the slot at %{licence_url} with your key."
  kept_dir: "Removed antigravity-notifier's files from %{path}. The folder holds other files too, so it was left in place."
  remove_binary: "antigravity-notifier itself is still installed. To remove it: %{command}"

# What the phone shows, and the desktop notification repeats, when Antigravity gives no text of its
# own. The apps display it as sent, so it is in the computer's language.
payload:
  # %{tool} is Antigravity's tool name: run_command, write_file, edit_file...
  needs_permission: "%{tool} needs permission"
  permission_required: "Permission required"
  has_questions: "Antigravity has questions"
  # %{prompt} is what the user asked Antigravity to do
  finished_prompt: "Finished: %{prompt}"
  question_header: "Question"
  # What the phone shows for a write_file or edit_file call
  edit_file: "Edit %{file}"
  # The done card when the turn ended because something went wrong; %{error} is Antigravity's own message
  stopped_error: "Antigravity stopped because of an error: %{error}"

# When the server can't be reached at all (no connection, DNS, timeout). The raw error follows
# on the next line.
net:
  unreachable: "Couldn't reach the Antigravity Notifier server. Check your internet connection and try again."
  # A `antigravity-notifier doctor` line, in the same label: text style as the doctor.* lines
  doctor_unreachable: "server: couldn't reach %{url}. Check your internet connection, proxy or firewall"

# The frame around the cli.* descriptions: `antigravity-notifier --help` headings and the -h / -V flags
clap:
  # Headings: a word and a colon, as other command-line tools in your language write them
  usage: "Usage:"
  commands: "Commands:"
  arguments: "Arguments:"
  options: "Options:"
  help: "Print help"
  version: "Print version"
  help_command: "Show the help for antigravity-notifier or for one of its commands"
  help_command_arg: "The command to show the help for"
  # Printed under clap's own (English) message when a command line can't be parsed
  error_hint: "Run `antigravity-notifier --help` to see the commands and options."

# `antigravity-notifier upgrade` refused a release whose SHA256SUMS isn't signed by TouchTap
update_signature:
  invalid: "the release's signature doesn't check out, so nothing was changed. Try again later, or reinstall from %{cli_url}"
