# Suggests the Claude Code Notifier app (and its ccn CLI) to someone who also uses Claude Code (crosspromo.rs).
# "Claude Code Notifier", command and url are not translated; never name one computer platform.
cross_promo:
  line: "Đã phát hiện Claude Code — nhận cả yêu cầu phê duyệt và câu hỏi của Claude Code trên điện thoại, với ứng dụng Claude Code Notifier (iPhone và Android). Thiết lập máy tính này bằng một lệnh: %{command}  ·  %{url}"
  notification: "Đã phát hiện Claude Code — nhận cả yêu cầu phê duyệt của Claude Code trên điện thoại, với ứng dụng Claude Code Notifier."
  # After `antigravity-notifier pair`, above a QR code (pair_scan) or without one (pair_steps), the app's link and the command
  pair_title: "Đã phát hiện Claude Code — nhận cả yêu cầu phê duyệt và câu hỏi của Claude Code trên điện thoại, với ứng dụng Claude Code Notifier (iPhone và Android)."
  pair_scan: "Quét để tải ứng dụng, rồi thiết lập máy tính này bằng một lệnh:"
  pair_steps: "Tải ứng dụng, rồi thiết lập máy tính này bằng một lệnh:"

# The push when a tool call that was allowed with the user at the keyboard is still open after
# they walked away (walkaway.rs). %{summary} is the command or file; it can't be approved from the phone.
walkaway:
  title: "Antigravity có thể đang chờ bạn"
  body: "%{summary} chưa xong. Nếu cần phê duyệt, hãy thao tác trên máy tính của bạn."

# Asks once, after 20 answers from the phone, for an app-store rating (rate.rs). url is not translated.
rate:
  notification: "Bạn thích Antigravity Notifier? Một đánh giá nhanh giúp các nhà phát triển khác tìm thấy ứng dụng."
