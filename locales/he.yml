forget:
  needs_yes: "antigravity-notifier forget דורש אישור מכם: הריצו אותו בטרמינל, או הוסיפו --yes"
  warning: "זה מוחק את המחשב הזה ואת הצימודים שלו משרת Antigravity Notifier, ואז מסיר את antigravity-notifier\nמ-Antigravity ומוחק את פרטי הגישה והקבצים שלו כאן, כמו `antigravity-notifier uninstall`.\nטלפונים שמצומדים למחשב הזה יראו אותו נעלם.\nרישיון שנרכש באתר לא מבוטל: עשו זאת ב-%{licence_url}\nעם \"מחיקת הרישיון שלי\"."
  # The word the user must type; `yes` is always accepted as well
  yes_word: "כן"
  prompt: "\nהקלידו %{yes} כדי להמשיך: "
  nothing_erased: "שום דבר לא נמחק."
  erased: "המחשב הזה והצימודים שלו נמחקו מהשרת."
  already_forgotten: "השרת כבר שכח את המחשב הזה."
