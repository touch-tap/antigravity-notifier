# they walked away (walkaway.rs). %{summary} is the command or file; it can't be approved from the phone.
walkaway:
  title: "ייתכן ש-Antigravity מחכה לך"
  body: "%{summary} עדיין לא הסתיים. אם נדרש אישור, הוא מחכה במחשב שלך."

