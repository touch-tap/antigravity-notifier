  code_lasts: "  Подключайте, когда удобно: этот код действует %{duration}."
  completes_on_its_own: "  Подключение завершится само, когда телефон подключится."
  waiting: "  Ожидание телефона... (Ctrl+C не навредит: подключение завершится само, когда телефон подключится)"
  code_expired: "код истёк раньше, чем его использовал телефон. Выполните `antigravity-notifier pair` ещё раз."
  code_is_six_digits: "код — это 6 цифр, которые показывает приложение Antigravity Notifier"
  credentials_stored: "Учётные данные сохранены в %{store} (%{path})."
  test_sent: "Тестовое уведомление отправлено на ваш телефон."
  test_failed: "Пока не удалось отправить тестовое уведомление: %{error}"
  done: "Готово. Запускайте Antigravity (`agy`) как обычно: вы получите push, когда он закончит или вы ему\nпонадобитесь, а подтверждать, отклонять и отвечать можно с телефона. `antigravity-notifier doctor` проверяет всё."
  paired_with: "Подключено к %{name} (%{platform})."
  hours_one: "1 час"
  hours_other: "%{count} ч"
  minutes_one: "1 минуту"
  minutes_other: "%{count} мин"
  pitch: "Телефон предложит подписку в приложении. Можно также разблокировать всё отсюда, минуя магазины приложений:"
  pitch_annual: "  antigravity-notifier unlock             %{price} в год"
  pitch_lifetime: "  antigravity-notifier unlock --lifetime  %{price} один раз"
  pitch_covers: "Покрывает %{computers} компьютера и каждый подключённый к ним телефон. Возврат денег в течение %{days} дней."
  welcome_no_terminal: "Тестовое уведомление уже летит на ваш телефон: попробуйте ответить на него там."
  welcome: "Тестовое уведомление уже летит на ваш телефон. Попробуйте ответить на него там..."
  welcome_skip: "(нажмите Enter, чтобы пропустить)"
  welcome_answered: "✓ Ваш телефон ответил \"%{answer}\". Так вы будете отвечать Antigravity."
  welcome_no_answer: "Ответа пока нет. Уведомление останется на телефоне на час."

