# The push when a tool call that was allowed with the user at the keyboard is still open after
# they walked away (walkaway.rs). %{summary} is the command or file; it can't be approved from the phone.
walkaway:
  title: "Возможно, Antigravity ждёт вас"
  body: "%{summary} ещё не завершено. Если нужно подтверждение, оно ждёт на компьютере."

# Asks once, after 20 answers from the phone, for an app-store rating (rate.rs). url is not translated.
rate:
  notification: "Нравится Antigravity Notifier? Короткая оценка поможет другим разработчикам его найти."
