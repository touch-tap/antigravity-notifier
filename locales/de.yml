  kept_dir: "Die Dateien von antigravity-notifier wurden aus %{path} entfernt. Der Ordner enthält noch andere Dateien und bleibt deshalb bestehen."
  remove_binary: "antigravity-notifier selbst ist noch installiert. So entfernst du es: %{command}"

# What the phone shows, and the desktop notification repeats, when Antigravity gives no text of its
# own. The apps display it as sent, so it is in the computer's language.
payload:
  # %{tool} is Antigravity's tool name: run_command, write_file, edit_file...
  needs_permission: "%{tool} braucht eine Freigabe"
  permission_required: "Freigabe erforderlich"
  has_questions: "Antigravity hat Fragen"
  # %{prompt} is what the user asked Antigravity to do
  finished_prompt: "Fertig: %{prompt}"
  question_header: "Frage"
  # What the phone shows for a write_file or edit_file call
  edit_file: "%{file} bearbeiten"
  # The done card when the turn ended because something went wrong; %{error} is Antigravity's own message
  stopped_error: "Antigravity wurde wegen eines Fehlers beendet: %{error}"

# When the server can't be reached at all (no connection, DNS, timeout). The raw error follows
# on the next line.
net:
  unreachable: "Der Server von Antigravity Notifier ist nicht erreichbar. Prüfe deine Internetverbindung und versuch es noch einmal."
  # A `antigravity-notifier doctor` line, in the same label: text style as the doctor.* lines
  doctor_unreachable: "Server: %{url} nicht erreichbar. Prüfe Internetverbindung, Proxy oder Firewall"

# The frame around the cli.* descriptions: `antigravity-notifier --help` headings and the -h / -V flags
clap:
  # Headings: a word and a colon, as other command-line tools in your language write them
  usage: "Verwendung:"
  commands: "Befehle:"
  arguments: "Argumente:"
  options: "Optionen:"
  help: "Hilfe anzeigen"
  version: "Version anzeigen"
  help_command: "Hilfe zu antigravity-notifier oder zu einem seiner Befehle anzeigen"
  help_command_arg: "Der Befehl, zu dem die Hilfe angezeigt wird"
  # Printed under clap's own (English) message when a command line can't be parsed
  error_hint: "Mit `antigravity-notifier --help` siehst du alle Befehle und Optionen."

# `antigravity-notifier upgrade` refused a release whose SHA256SUMS isn't signed by TouchTap
update_signature:
  invalid: "die Signatur des Release stimmt nicht, daher wurde nichts geändert. Versuch es später noch einmal oder installiere neu über %{cli_url}"
