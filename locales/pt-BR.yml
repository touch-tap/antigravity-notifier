  needs_permission: "%{tool} precisa de permissão"
  permission_required: "Permissão necessária"
  has_questions: "O Antigravity tem perguntas"
  # %{prompt} is what the user asked Antigravity to do
  finished_prompt: "Concluído: %{prompt}"
  question_header: "Pergunta"
  # What the phone shows for a write_file or edit_file call
  edit_file: "Editar %{file}"
  # The done card when the turn ended because something went wrong; %{error} is Antigravity's own message
  stopped_error: "O Antigravity parou por causa de um erro: %{error}"

# When the server can't be reached at all (no connection, DNS, timeout). The raw error follows
# on the next line.
net:
  unreachable: "Não foi possível acessar o servidor do Antigravity Notifier. Verifique sua conexão com a internet e tente de novo."
  # A `antigravity-notifier doctor` line, in the same label: text style as the doctor.* lines
  doctor_unreachable: "servidor: não foi possível acessar %{url}. Verifique sua conexão com a internet, o proxy ou o firewall"

# The frame around the cli.* descriptions: `antigravity-notifier --help` headings and the -h / -V flags
clap:
  # Headings: a word and a colon, as other command-line tools in your language write them
  usage: "Uso:"
  commands: "Comandos:"
  arguments: "Argumentos:"
  options: "Opções:"
  help: "Mostrar a ajuda"
  version: "Mostrar a versão"
  help_command: "Mostrar a ajuda do antigravity-notifier ou de um dos comandos dele"
  help_command_arg: "O comando cuja ajuda será mostrada"
  # Printed under clap's own (English) message when a command line can't be parsed
  error_hint: "Execute `antigravity-notifier --help` para ver os comandos e as opções."

# `antigravity-notifier upgrade` refused a release whose SHA256SUMS isn't signed by TouchTap
update_signature:
  invalid: "a assinatura da versão não é válida, então nada foi alterado. Tente mais tarde ou reinstale em %{cli_url}"
