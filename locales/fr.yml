# What the phone shows, and the desktop notification repeats, when Antigravity gives no text of its
# own. The apps display it as sent, so it is in the computer's language.
payload:
  # %{tool} is Antigravity's tool name: run_command, write_file, edit_file...
  needs_permission: "%{tool} demande une autorisation"
  permission_required: "Autorisation requise"
  has_questions: "Antigravity a des questions"
  # %{prompt} is what the user asked Antigravity to do
  finished_prompt: "Terminé : %{prompt}"
  question_header: "Question"
  # What the phone shows for a write_file or edit_file call
  edit_file: "Modifier %{file}"
  # The done card when the turn ended because something went wrong; %{error} is Antigravity's own message
  stopped_error: "Antigravity s'est arrêté à cause d'une erreur : %{error}"

# When the server can't be reached at all (no connection, DNS, timeout). The raw error follows
# on the next line.
net:
  unreachable: "Impossible de joindre le serveur d'Antigravity Notifier. Vérifie ta connexion internet et réessaie."
  # A `antigravity-notifier doctor` line, in the same label: text style as the doctor.* lines
  doctor_unreachable: "serveur : impossible de joindre %{url}. Vérifie ta connexion internet, ton proxy ou ton pare-feu"

# The frame around the cli.* descriptions: `antigravity-notifier --help` headings and the -h / -V flags
clap:
  # Headings: a word and a colon, as other command-line tools in your language write them
  usage: "Utilisation :"
  commands: "Commandes :"
  arguments: "Arguments :"
  options: "Options :"
  help: "Afficher l'aide"
  version: "Afficher la version"
  help_command: "Afficher l'aide de antigravity-notifier ou de l'une de ses commandes"
  help_command_arg: "La commande dont afficher l'aide"
  # Printed under clap's own (English) message when a command line can't be parsed
  error_hint: "Lance `antigravity-notifier --help` pour voir les commandes et les options."

# `antigravity-notifier upgrade` refused a release whose SHA256SUMS isn't signed by TouchTap
update_signature:
  invalid: "la signature de la version n'est pas valide, rien n'a donc été modifié. Réessaie plus tard ou réinstalle depuis %{cli_url}"
